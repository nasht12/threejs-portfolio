<title>Gulf Stream Study</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Work+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ink:#f4f8f6;
    --ink-dim:#d6e6e4;
    --bg:#0d4a55;
    --bg-deep:#06262c;
    --accent:#ffd9a0;
    color-scheme: dark;
  }
  html,body{height:100%;margin:0;background:var(--bg-deep);}
  #app{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:linear-gradient(#5d9ccc 0%, #cfe6ee 52%, var(--bg) 54%, var(--bg-deep) 100%);
    touch-action:none;
    cursor:grab;
  }
  #app.dragging{cursor:grabbing;}
  canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hud{
    position:absolute;inset:0;
    pointer-events:none;
    padding: calc(26px + env(safe-area-inset-top,0px)) 28px calc(24px + env(safe-area-inset-bottom,0px)) 28px;
    display:flex;flex-direction:column;justify-content:space-between;
    user-select:none;
  }
  .hud-top{display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(-8px);animation:hudIn 1.6s cubic-bezier(.2,.7,.2,1) .7s forwards;}
  .eyebrow{
    font-family:'Work Sans',sans-serif;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);text-shadow:0 1px 12px rgba(0,30,40,.45);
  }
  h1{
    font-family:'Fraunces',Georgia,serif;font-weight:560;font-style:normal;
    font-size:clamp(28px,5.4vw,52px);line-height:1.02;margin:0;
    color:var(--ink);text-wrap:balance;
    text-shadow:0 2px 30px rgba(0,30,40,.45);
  }
  .hud-bottom{max-width:44ch;opacity:0;transform:translateY(8px);animation:hudIn 1.6s cubic-bezier(.2,.7,.2,1) 1.1s forwards;}
  .caption{
    font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.65;
    color:var(--ink-dim);margin:0;text-shadow:0 1px 14px rgba(0,30,40,.6);
  }
  .caption em{color:var(--ink);font-style:italic;}
  @keyframes hudIn{to{opacity:1;transform:none;}}
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 95% 85% at 50% 45%, transparent 55%, rgba(2,24,30,.38) 100%);
  }
  #loader{
    position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    background:var(--bg-deep);transition:opacity .9s ease, visibility .9s;
  }
  #loader.hide{opacity:0;visibility:hidden;}
  .ring{width:42px;height:42px;border-radius:50%;border:2px solid rgba(238,241,234,.15);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{font-family:'Work Sans',sans-serif;color:var(--ink-dim);font-size:13px;text-align:center;max-width:280px;display:none;}
  @media (max-width:480px){
    h1{font-size:30px;}
    .hud{padding:20px;}
    .hud-bottom{max-width:34ch;}
  }
  @media (prefers-reduced-motion: reduce){
    .hud-top,.hud-bottom{animation-duration:.3s;}
    .ring{animation-duration:2.2s;}
  }
</style>

<div id="app">
  <canvas id="scene" aria-label="Open turquoise sea under a clear sky. Drag to look around."></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div class="hud-top">
      <span class="eyebrow">The sea of Winslow Homer&rsquo;s Gulf Stream, 1899</span>
      <h1>The Gulf&nbsp;Stream</h1>
    </div>
    <div class="hud-bottom">
      <p class="caption">Only the water: <em>turquoise swell</em> running before the trade wind, the sun showing through every crest.</p>
    </div>
  </div>
  <div id="loader">
    <div class="ring"></div>
    <p class="err" id="errMsg">The current is too strong to render right now — reload to try again.</p>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

try {

const app = document.getElementById('app');
const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------
   The sea: a sum of Gerstner waves, generated once from a seed.
   The first NV (the long swell) move the mesh; all NW shade it,
   per pixel, so the short chop stays crisp on a modest grid.
   Each wave fades out as it shrinks below a few pixels, and the
   slope it carried becomes highlight roughness — so the far sea
   reads as a soft sun path instead of sparkling.
----------------------------------------------------------------*/
const NV = 8, NW = 24;
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(1899);
const WIND = Math.PI*0.5 - 0.35;                 // swell runs toward the viewer, a little from the left
const waveA = [], waveB = [];                    // (dir.x, dir.z, k, amplitude) · (omega, phase, Q, 0)
for (let i = 0; i < NW; i++){
  const L = 62 * Math.pow(0.78, i);              // 62 m swell down to ~0.2 m chop
  const swell = i < NV;
  const A = L * (swell ? 0.0105 : 0.0075);
  const spread = 0.45 + 1.7 * i / NW;             // short waves come from more directions
  const ang = WIND + (rand()*2 - 1) * spread;
  const k = 2*Math.PI / L;
  const Q = swell ? 0.72 / (k*A*NV) : 0.28 / (k*A*(NW - NV));   // sum of Q·k·A stays below 1: no looping crests
  waveA.push(new THREE.Vector4(Math.cos(ang), Math.sin(ang), k, A));
  waveB.push(new THREE.Vector4(Math.sqrt(9.81*k), rand()*Math.PI*2, Q, 0));
}
// height of the swell at (x, z) — the same waves the vertex shader moves the mesh with
function swellHeight(x, z, t){
  let h = 0;
  for (let i = 0; i < NV; i++){
    const a = waveA[i], b = waveB[i];
    h += a.w * Math.sin(a.z*(a.x*x + a.y*z) - b.x*t + b.y);
  }
  return h;
}

const SKY_GLSL = `
  uniform vec3 uZenith, uHorizon, uSunDir, uSunColor, uCloud;
  uniform float uTime;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*43758.5453); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
  }
  float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=0.5; } return s; }
  vec3 skyColor(vec3 d){
    float y = max(d.y, 0.0);
    vec3 col = mix(uHorizon, uZenith, pow(y, 0.4));
    float sd = max(dot(d, uSunDir), 0.0);
    col += uSunColor * (pow(sd, 6.0)*0.10 + pow(sd, 90.0)*0.35);
    // fair-weather cumulus sitting low over the sea
    vec2 cp = d.xz / (y + 0.09);
    float c = fbm(cp*0.55 + vec2(uTime*0.006, 0.0));
    c = smoothstep(0.56, 0.78, c) * smoothstep(0.0, 0.05, y) * (1.0 - smoothstep(0.22, 0.55, y));
    vec3 cloud = uCloud * (0.8 + 0.35*pow(sd, 3.0));
    return mix(col, cloud, c*0.9);
  }
`;

/* ---------------------------------------------------------------
   Renderer / scene / camera
----------------------------------------------------------------*/
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.3, 3200);
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const sunDir = new THREE.Vector3(-0.42, 0.52, -0.74).normalize();   // ahead and to the left, mid-morning
const skyUniforms = {
  uTime:{value:0},
  uZenith:{value:new THREE.Color(0x1758a8)},
  uHorizon:{value:new THREE.Color(0x9ccbe0)},
  uSunDir:{value:sunDir},
  uSunColor:{value:new THREE.Color(0xfff1d6).multiplyScalar(1.0)},
  uCloud:{value:new THREE.Color(0xf6f8f8)},
};

/* ---------------------------------------------------------------
   Sky dome
----------------------------------------------------------------*/
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms: skyUniforms,
  vertexShader:`
    varying vec3 vDir;
    void main(){
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader:`
    varying vec3 vDir;
    ${SKY_GLSL}
    void main(){
      vec3 d = normalize(vDir);
      vec3 col = skyColor(d);
      col += uSunColor * smoothstep(0.99955, 0.99975, dot(d, uSunDir)) * 18.0;   // the disc
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2800, 48, 24), skyMat);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

/* ---------------------------------------------------------------
   Ocean grid: dense under the viewer, coarse toward the horizon.
   aSpacing (metres between vertices) lets the vertex shader drop
   swell it can no longer sample, instead of letting it swim.
----------------------------------------------------------------*/
function buildOceanGrid(N, R){
  const map = u => R * u * (0.06 + 0.94*u*u);
  const step = u => R * (0.06 + 2.82*u*u) * (2/N);
  const pos = new Float32Array((N+1)*(N+1)*3), spacing = new Float32Array((N+1)*(N+1));
  let v = 0;
  for (let j = 0; j <= N; j++){
    const uz = j/N*2 - 1;
    for (let i = 0; i <= N; i++){
      const ux = i/N*2 - 1;
      pos[v*3] = map(ux); pos[v*3+1] = 0; pos[v*3+2] = map(uz);
      spacing[v] = Math.max(step(ux), step(uz));
      v++;
    }
  }
  const idx = new Uint32Array(N*N*6);
  let k = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++){
    const a = j*(N+1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx[k++] = a; idx[k++] = c; idx[k++] = b;
    idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSpacing', new THREE.BufferAttribute(spacing, 1));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

const WAVES_GLSL = `
  #define NV ${NV}
  #define NW ${NW}
  uniform vec4 uWaveA[NW];
  uniform vec4 uWaveB[NW];
`;

const oceanMat = new THREE.ShaderMaterial({
  uniforms:{
    ...skyUniforms,
    uWaveA:{value:waveA},
    uWaveB:{value:waveB},
    uDeep:{value:new THREE.Color(0x04505e)},
    uScatter:{value:new THREE.Color(0x13d1c0)},
    uFoam:{value:new THREE.Color(0xf2f7f5)},
    uCameraPos:{value:camera.position},
  },
  vertexShader:`
    ${WAVES_GLSL}
    uniform float uTime;
    attribute float aSpacing;
    varying vec2 vGrid;
    varying vec3 vWorld;
    varying float vHeight;
    void main(){
      vec2 p = position.xz;
      vec3 d = vec3(0.0);
      for (int i = 0; i < NV; i++){
        vec4 a = uWaveA[i], b = uWaveB[i];
        float A = a.w * smoothstep(3.0, 6.0, 6.2831853 / a.z / aSpacing);
        float th = a.z * dot(a.xy, p) - b.x*uTime + b.y;
        d.xz += b.z * A * a.xy * cos(th);
        d.y  += A * sin(th);
      }
      vec3 pos = vec3(p.x + d.x, d.y, p.y + d.z);
      vGrid = p; vWorld = pos; vHeight = d.y;
      gl_Position = projectionMatrix * viewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader:`
    ${WAVES_GLSL}
    ${SKY_GLSL}
    uniform vec3 uDeep, uScatter, uFoam, uCameraPos;
    varying vec2 vGrid;
    varying vec3 vWorld;
    varying float vHeight;
    void main(){
      vec2 p = vGrid;
      float fp = max(length(dFdx(p)), length(dFdy(p)));    // metres per pixel here

      vec3 n = vec3(0.0, 1.0, 0.0);
      float J = 1.0;            // surface compression from the swell: low = a crest about to break
      float lost = 0.0;         // slope variance of the waves too small to draw here
      // the chop rides a slow, wandering offset so its crests don't line up into ripples
      vec2 warp = (vec2(vnoise(p*0.045), vnoise(p*0.045 + 31.7)) - 0.5) * 9.0;
      for (int i = 0; i < NW; i++){
        vec4 a = uWaveA[i], b = uWaveB[i];
        float L = 6.2831853 / a.z;
        float w = smoothstep(2.0*fp, 6.0*fp, L);
        float kA = a.z * a.w;
        vec2 q = i < NV ? p : p + warp;
        float th = a.z * dot(a.xy, q) - b.x*uTime + b.y;
        float c = cos(th), s = sin(th);
        n.xz -= a.xy * kA * c * w;
        n.y  -= b.z * kA * s * w;
        if (i < NV) J -= b.z * kA * s;
        lost += (1.0 - w) * kA * kA * 0.5;
      }
      n.y = max(n.y, 0.2);
      n = normalize(n);

      vec3 toCam = uCameraPos - vWorld;
      float dist = length(toCam);
      vec3 V = toCam / dist;
      vec3 L = uSunDir;
      float NV_ = max(dot(n, V), 0.0);

      // reflection: the sky, with Fresnel
      vec3 R = reflect(-V, n);
      R.y = abs(R.y);
      float F = 0.02 + 0.98 * pow(1.0 - NV_, 5.0);
      vec3 refl = skyColor(R);

      // body: dark turquoise lit from inside, glowing where the sun shines through thin crests
      float crest = clamp(vHeight * 0.9 + 0.35, 0.0, 1.6);
      float through = pow(max(dot(L, -V) * 0.5 + 0.5, 0.0), 4.0) * pow(0.5 - 0.5*dot(L, n), 2.0);
      float facing  = pow(NV_, 2.0);
      vec3 body = uDeep * (0.55 + 0.45*max(dot(n, L), 0.0))
                + uScatter * uSunColor * (0.55*facing + 2.2*crest*through + 0.18*max(dot(n,L),0.0));

      // sun glitter: a Gaussian slope lobe, widened by the slope we stopped drawing
      vec3 H = normalize(L + V);
      float nh = max(dot(n, H), 1e-3);
      float s2 = 0.0028 + lost;
      float tan2 = (1.0 - nh*nh) / (nh*nh);
      float D = exp(-tan2 / (2.0*s2)) / (6.2831853 * s2 * nh*nh*nh*nh);
      float Fs = 0.02 + 0.98 * pow(1.0 - max(dot(H, V), 0.0), 5.0);
      vec3 spec = uSunColor * D * Fs * max(dot(n, L), 0.0) / (4.0 * max(NV_, 0.15)) * 1.3;

      vec3 col = mix(body, refl, F) + spec;

      // foam where the swell pinches, broken up by drifting noise; detail fades with distance
      float fn = fbm(p*0.45 + vec2(uTime*0.05, -uTime*0.09));
      fn = mix(fn, 0.5, smoothstep(0.08, 0.6, fp));
      float foam = smoothstep(0.42, 0.18, J + (fn - 0.5)*0.35);
      foam *= 0.25 + 0.75*smoothstep(0.3, 0.75, fbm(p*1.7 - vec2(uTime*0.12, 0.0)));
      col = mix(col, uFoam * (0.7 + 0.5*max(dot(n,L),0.0)), clamp(foam, 0.0, 1.0) * 0.85);

      // aerial perspective into the horizon colour of the sky behind it, so the sea's edge disappears
      // (at the horizon the sky has no cloud, so skip the noise: just its colour and the sun's glow)
      float sh = max(dot(normalize(vec3(-V.x, 0.0, -V.z)), uSunDir), 0.0);
      vec3 hz = uHorizon + uSunColor * (pow(sh, 6.0)*0.10 + pow(sh, 90.0)*0.35);
      float fog = max(1.0 - exp(-dist * 0.0011), smoothstep(1050.0, 1450.0, dist));
      col = mix(col, hz, clamp(fog, 0.0, 1.0));

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const ocean = new THREE.Mesh(buildOceanGrid(320, 1500), oceanMat);
ocean.frustumCulled = false;
scene.add(ocean);

/* ---------------------------------------------------------------
   Drag to look; the view drifts and rides the swell on its own
----------------------------------------------------------------*/
let yaw = 0, pitch = -0.13, yawT = 0, pitchT = -0.13, dragging = null;
app.addEventListener('pointerdown', e => { dragging = { x:e.clientX, y:e.clientY }; app.classList.add('dragging'); app.setPointerCapture(e.pointerId); });
app.addEventListener('pointermove', e => {
  if (!dragging) return;
  yawT   += (e.clientX - dragging.x) * 0.0035;
  pitchT  = Math.max(-0.45, Math.min(0.3, pitchT + (e.clientY - dragging.y) * 0.0025));
  dragging = { x:e.clientX, y:e.clientY };
});
const endDrag = () => { dragging = null; app.classList.remove('dragging'); };
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

/* ---------------------------------------------------------------
   Animate
----------------------------------------------------------------*/
resize();
let firstFrame = true, ride = 0;
const look = new THREE.Vector3();

function animate(now){
  const t = reduceMotion ? now*0.0003 : now*0.001;
  skyUniforms.uTime.value = t;

  yaw += (yawT - yaw) * 0.08;
  pitch += (pitchT - pitch) * 0.08;

  // a viewer low on the water, lifted a little by each passing swell
  const cx = Math.sin(t*0.04)*0.6, cz = 0;
  ride += (swellHeight(cx, cz, t) - ride) * 0.12;
  camera.position.set(cx, 5.2 + ride*0.45, cz);
  const sway = reduceMotion ? 0 : Math.sin(t*0.5)*0.008;
  look.set(Math.sin(yaw), Math.tan(pitch + sway), -Math.cos(yaw)).add(camera.position);
  camera.lookAt(look);
  camera.rotateZ(reduceMotion ? 0 : Math.sin(t*0.37)*0.006 + ride*0.004);
  sky.position.copy(camera.position);

  renderer.render(scene, camera);

  if (firstFrame){
    firstFrame = false;
    requestAnimationFrame(()=> loaderEl.classList.add('hide'));
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

} catch (err){
  console.error(err);
  const ring = document.querySelector('.ring');
  const msg = document.getElementById('errMsg');
  if (ring) ring.style.display = 'none';
  if (msg) msg.style.display = 'block';
}
</script>
